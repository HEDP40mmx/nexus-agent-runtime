name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.4.240"
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/check_required_files.sh
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e ".[test]" || pip install -e . pytest
          python -m compileall -q nexus
          python -m pytest -q
      - name: Build source archive (honours .gitattributes export-ignore)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          git archive --format=zip --prefix="nexus-v${VERSION}/" -o "dist/nexus-v${VERSION}-source.zip" HEAD
          git archive --format=tar.gz --prefix="nexus-v${VERSION}/" -o "dist/nexus-v${VERSION}-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Reject sensitive files in archive
        run: |
          if unzip -Z1 dist/*.zip | grep -Ei '(^|/)(\.env|.*\.(pem|key|sqlite3?|db))$|\.github/'; then
            echo "Sensitive file in archive"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Create GitHub Release (creates tag; never touches branches)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Nexus v${VERSION}" --generate-notes
