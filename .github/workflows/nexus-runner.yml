name: Nexus background runner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Prove repository write access
        shell: bash
        run: |
          set -euo pipefail
          proof_file=".nexus-runner-write-proof.md"

          cat > "$proof_file" <<'EOF'
          # Nexus runner write proof

          Created by `.github/workflows/nexus-runner.yml` to verify that this
          GitHub Actions workflow can create and commit a repository file.
          EOF

          git add -- "$proof_file"

          if git diff --cached --quiet -- "$proof_file"; then
            proof_commit="$(git log -1 --format=%H -- "$proof_file")"
            echo "Proof file is unchanged; no commit created. Latest proof commit: ${proof_commit:-none}"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "ci: prove runner repository write"

            proof_commit="$(git rev-parse HEAD)"
            echo "Created proof commit: $proof_commit"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Pushed proof commit to ${GITHUB_REF_NAME}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[test]" || pip install -e .
          fi

      - name: Run validation
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            python -m compileall -q .
          fi

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Nexus runner result"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
