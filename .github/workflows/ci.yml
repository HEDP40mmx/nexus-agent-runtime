name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require runtime files and tests
        run: scripts/check_required_files.sh
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e ".[test]" || pip install -e . pytest
      - name: Compile
        run: python -m compileall -q nexus
      - name: Run full test suite
        run: python -m pytest -q   # exit code 5 (no tests collected) fails the job
